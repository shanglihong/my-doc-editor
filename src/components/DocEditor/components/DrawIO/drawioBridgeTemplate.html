<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f8f9fa;
    }
    #drawio-iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <iframe
    id="drawio-iframe"
    src="__TARGET_APP_URL__"
    sandbox="allow-scripts allow-same-origin allow-popups allow-forms allow-modals allow-downloads"
  ></iframe>

  <script>
    (function() {
      const iframe = document.getElementById('drawio-iframe');
      let currentXml = '';

      window.addEventListener('message', function(e) {
        if (!e.data) return;

        let msg = e.data;
        if (typeof msg === 'string') {
          try {
            msg = JSON.parse(msg);
          } catch (err) {
            // 忽略非 JSON 消息
          }
        }

        if (typeof msg !== 'object') return;

        // 接收来自外层宿主组件的初始化数据设置
        if (msg.type === 'SET_INITIAL_XML') {
          currentXml = msg.xml || '';
          return;
        }

        // 处理 draw.io 内部发送的消息并转发给父窗口
        if (msg.event === 'init') {
          try {
            iframe.contentWindow.postMessage(JSON.stringify({ action: 'load', xml: currentXml, autosave: 1 }), '*');
          } catch (err) {}
          try {
            window.parent.postMessage(JSON.stringify({ event: 'drawio-ready' }), '*');
          } catch (err) {}
        }

        if (msg.event === 'save') {
          try {
            iframe.contentWindow.postMessage(JSON.stringify({ action: 'export', format: 'xmlsvg', spin: 'Saving' }), '*');
          } catch (err) {}
        }

        if (msg.event === 'export') {
          const previewData = msg.data || msg.xmlpng || '';
          try {
            window.parent.postMessage(JSON.stringify({
              event: 'save',
              xml: msg.xml || currentXml,
              svg: previewData
            }), '*');
          } catch (err) {}
        }

        if (msg.event === 'exit') {
          try {
            window.parent.postMessage(JSON.stringify({ event: 'exit' }), '*');
          } catch (err) {}
        }
      });
    })();
  </script>
</body>
</html>
